[package]
name = "claude-agent-sdk"
version = "0.1.0"
edition = "2021"
authors = ["Pandelis Z <pandelis@example.com>"]
description = "Rust SDK for Claude CLI"
license = "MIT"
repository = "https://github.com/PandelisZ/claude-agent-sdk-rust"

[dependencies]
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "time", "fs", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio-util = { version = "0.7", features = ["codec", "io"] }
bytes = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde", "clock", "std"] }
tracing = "0.1"
async-trait = "0.1"
which = "6"
futures = "0.3"
dirs = "5"

[dev-dependencies]
tokio-test = "0.4"
